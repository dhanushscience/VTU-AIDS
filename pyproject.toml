[project]
name = "vtu-aids"
version = "2.1.1"
description = "VTU AIDS - Automated Internship Diary System for VTU Internyet"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["vtu", "internship", "diary", "playwright", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/dhanushscience/VTU-AIDS"
Repository = "https://github.com/dhanushscience/VTU-AIDS"
[tool.setuptools]
packages = ["app"]
